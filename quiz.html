      const LABELS = ['ก', 'ข', 'ค', 'ง'];
      let answered = new Set();

      function buildQuiz() {
        const form = document.getElementById('quizForm');
        form.innerHTML = '';
        questions.forEach((item, qi) => {
          const card = document.createElement('div');
          card.className = 'question-card';
          card.id = `qcard-${qi}`;
          const num = document.createElement('div');
          num.className = 'question-number';
          num.textContent = `ข้อที่ ${qi + 1} จาก ${questions.length}`;
          const qtext = document.createElement('div');
          qtext.className = 'question-text';
          qtext.textContent = item.q;
          const opts = document.createElement('div');
          opts.className = 'options';
          item.opts.forEach((opt, oi) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'option';
            wrapper.id = `opt-${qi}-${oi}`;
            const input = document.createElement('input');
            input.type = 'radio';
            input.name = `q${qi}`;
            input.value = oi;
            input.id = `inp-${qi}-${oi}`;
            input.addEventListener('change', () => {
              answered.add(qi);
              updateProgress();
            });
            const label = document.createElement('label');
            label.htmlFor = `inp-${qi}-${oi}`;
            label.textContent = `${LABELS[oi]}. ${opt}`;
            wrapper.appendChild(input);
            wrapper.appendChild(label);
            wrapper.addEventListener('click', () => {
              input.checked = true;
              input.dispatchEvent(new Event('change'));
            });
            opts.appendChild(wrapper);
          });
          card.appendChild(num);
          card.appendChild(qtext);
          card.appendChild(opts);
          form.appendChild(card);
        });
      }

      function updateProgress() {
        const pct = Math.round((answered.size / questions.length) * 100);
        document.getElementById('progressBar').style.width = pct + '%';
        document.getElementById('progressLabel').textContent =
          `คำถาม ${answered.size} / ${questions.length} ข้อที่ตอบแล้ว`;
      }

      function submitQuiz() {
        let score = 0;
        questions.forEach((item, qi) => {
          const selected = document.querySelector(`input[name="q${qi}"]:checked`);
          const userAns = selected ? parseInt(selected.value) : -1;
          item.opts.forEach((_, oi) => {
            const wrapper = document.getElementById(`opt-${qi}-${oi}`);
            wrapper.classList.remove('correct', 'incorrect', 'reveal-correct');
            if (oi === item.ans) {
              if (userAns === oi) {
                wrapper.classList.add('correct');
                score++;
              } else {
                wrapper.classList.add('reveal-correct');
              }
            } else if (oi === userAns) {
              wrapper.classList.add('incorrect');
            }
            const inp = document.getElementById(`inp-${qi}-${oi}`);
            inp.disabled = true;
          });
        });

        const total = questions.length;
        const pct = Math.round((score / total) * 100);
        document.getElementById('scoreNum').textContent = `${score} / ${total}`;
        document.getElementById('scoreBar').style.width = pct + '%';

        let msg = '';
        if (pct >= 90) msg = '🏆 ยอดเยี่ยมมาก! คุณมีความรู้ด้านสิ่งแวดล้อมในระดับสูงมาก';
        else if (pct >= 75) msg = '🌟 ดีมาก! คุณมีความเข้าใจด้านสิ่งแวดล้อมเป็นอย่างดี';
        else if (pct >= 60) msg = '👍 ผ่าน! ยังมีบางส่วนที่สามารถพัฒนาเพิ่มเติมได้';
        else if (pct >= 40) msg = '📚 ลองทบทวนความรู้เพิ่มเติมและลองทำใหม่อีกครั้ง';
        else msg = '🌱 ศึกษาเนื้อหาเพิ่มเติมเกี่ยวกับสิ่งแวดล้อมแล้วมาลองใหม่นะคะ';
        document.getElementById('scoreMsg').textContent = msg;

        const card = document.getElementById('scoreCard');
        card.classList.add('show');
        card.scrollIntoView({ behavior: 'smooth', block: 'start' });

        document.getElementById('submitBtn').disabled = true;
      }

      function retryQuiz() {
        answered.clear();
        document.getElementById('scoreCard').classList.remove('show');
        document.getElementById('submitBtn').disabled = false;
        buildQuiz();
        updateProgress();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      buildQuiz();
      updateProgress();
    </script>
  </body>
</html>
